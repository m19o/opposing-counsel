<svg xmlns="http://www.w3.org/2000/svg" width="700" height="516" viewBox="0 0 700 516" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect x="0" y="0" width="700" height="516" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="32" y="52" font-size="26" font-weight="700" fill="#e6edf3">Maze fixture: recall per seat</text>
  <text x="32" y="80" font-size="14" fill="#8b949e">first scored run, 2026-10-17 · 4 free-tier models reviewed 6 re-introduced real bugs, blind</text>

  <!-- Section label -->
  <text x="32" y="116" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">RECALL PER SEAT · SCORE OUT OF 6</text>
  <line x1="32" y1="128" x2="668" y2="128" stroke="#30363d" stroke-width="1"/>

  <!-- Row 1: longcat -->
  <text x="32" y="160" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e6edf3">longcat-2.5-preview</text>
  <rect x="32" y="168" width="420" height="24" rx="5" fill="#30363d"/>
  <rect x="32" y="168" width="420" height="24" rx="5" fill="#d29922"/>
  <text x="464" y="186" font-size="15" font-weight="700" fill="#d29922">6/6*</text>

  <!-- Row 2: glm -->
  <text x="32" y="220" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e6edf3">glm-5.3-flash</text>
  <rect x="32" y="228" width="420" height="24" rx="5" fill="#30363d"/>
  <rect x="32" y="228" width="350" height="24" rx="5" fill="#3fb950"/>
  <text x="394" y="246" font-size="15" font-weight="700" fill="#3fb950">5/6 (clean run)</text>

  <!-- Row 3: deepseek -->
  <text x="32" y="280" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e6edf3">deepseek-v4.1-flash</text>
  <rect x="32" y="288" width="420" height="24" rx="5" fill="#30363d"/>
  <rect x="32" y="288" width="350" height="24" rx="5" fill="#d29922"/>
  <text x="394" y="306" font-size="15" font-weight="700" fill="#d29922">5/6*</text>

  <!-- Row 4: mimo -->
  <text x="32" y="340" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#e6edf3">mimo-v2.6-flash</text>
  <rect x="32" y="348" width="420" height="24" rx="5" fill="#30363d"/>
  <rect x="32" y="348" width="350" height="24" rx="5" fill="#d29922"/>
  <text x="394" y="366" font-size="15" font-weight="700" fill="#d29922">5/6*</text>

  <!-- Summary -->
  <line x1="32" y1="398" x2="668" y2="398" stroke="#30363d" stroke-width="1"/>
  <text x="32" y="428" font-size="16" font-weight="700" fill="#e6edf3">panel recall: <tspan fill="#3fb950">6/6</tspan> (at least one seat caught every seed)</text>

  <!-- Footnotes -->
  <line x1="32" y1="452" x2="668" y2="452" stroke="#30363d" stroke-width="1"/>
  <g font-size="12" fill="#8b949e">
    <text x="32" y="478">* seat left the fixture and diffed the pristine source (provenance slip, since scrubbed): practice-grade</text>
    <text x="32" y="496">two more seats died before reviewing: one upstream 503, one sandbox auto-reject</text>
